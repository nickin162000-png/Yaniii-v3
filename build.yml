name: Gerar .jar

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('build.gradle') }}

      - name: Baixar Gradle 2.14.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip

      - name: Preparar o Minecraft
        run: ./gradle-2.14.1/bin/gradle setupCiWorkspace --no-daemon

      - name: Converter nomes SRG para MCP
        run: |
          python3 - ~/.gradle src/main/java << 'PY'
          import csv, os, re, sys
          root, src = sys.argv[1], sys.argv[2]
          def find(name):
              best = None
              for d, _, files in os.walk(root):
                  if name in files:
                      p = os.path.join(d, name)
                      if best is None or ("stable" in p and "stable" not in best):
                          best = p
              return best
          mapping = {}
          for n in ("methods.csv", "fields.csv"):
              p = find(n)
              if not p:
                  sys.exit("nao achei " + n)
              print("usando", p)
              with open(p, newline="", encoding="utf-8") as f:
                  for row in csv.DictReader(f):
                      mapping[row["searge"]] = row["name"]
          print(len(mapping), "nomes no mapa")
          rx = re.compile(r"\b(?:func|field)_\d+_[A-Za-z0-9_]+\b")
          changed = [0]
          unknown = set()
          for d, _, files in os.walk(src):
              for fn in files:
                  if not fn.endswith(".java"):
                      continue
                  path = os.path.join(d, fn)
                  with open(path, encoding="utf-8") as f:
                      text = f.read()
                  def sub(m):
                      k = m.group(0)
                      if k in mapping:
                          changed[0] += 1
                          return mapping[k]
                      unknown.add(k)
                      return k
                  new = rx.sub(sub, text)
                  if new != text:
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(new)
          print(changed[0], "trocas feitas;", len(unknown), "sem mapa:", sorted(unknown)[:20])
          PY

      - name: Compilar
        run: ./gradle-2.14.1/bin/gradle build --no-daemon

      - name: Guardar o .jar
        uses: actions/upload-artifact@v4
        with:
          name: YaniClient-jar
          path: build/libs/*.jar
